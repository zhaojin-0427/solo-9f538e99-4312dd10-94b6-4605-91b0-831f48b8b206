<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}换版接驳核查{% endblock %}</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #1d4ed8; color: #fff; padding: 16px 28px; }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 10px; padding: 22px 26px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { font-size: 17px; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=number], input[type=file], input[type=date] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 14px; }
    button { margin-top: 18px; background: #1d4ed8; color: #fff; border: 0; border-radius: 6px; padding: 10px 26px; font-size: 15px; cursor: pointer; }
    button:hover { background: #1e40af; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #d9e2ec; padding: 7px 10px; text-align: left; vertical-align: top; }
    th { background: #f0f4f8; }
    .error { color: #b91c1c; }
    .alert { border-left: 4px solid #b91c1c; background: #fef2f2; padding: 12px 16px; border-radius: 6px; }
    .warn { border-left: 4px solid #b45309; background: #fffbeb; padding: 12px 16px; border-radius: 6px; }
    .ok { border-left: 4px solid #15803d; background: #f0fdf4; padding: 12px 16px; border-radius: 6px; }
    .muted { color: #627d98; font-size: 13px; }
    code { background: #f0f4f8; padding: 1px 5px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    ul.tight { margin: 6px 0; padding-left: 20px; }
  </style>
</head>
<body>
  <header><h1>公交时刻表换版 · 到站接驳核查</h1></header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
