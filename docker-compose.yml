services:
  web:
    build: .
    image: timetable-platform:latest
    container_name: timetable-platform
    ports:
      - "8000:8000"
    environment:
      TIMETABLE_STATE_PATH: /app/data/timetable_state.json
    volumes:
      # 已生效班表与各修订问题清单持久化，容器重启后仍可下载/查询
      - timetable-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  timetable-data:
